services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-testing-only}
      POSTGRES_DB: chatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://chatbot:${POSTGRES_PASSWORD:-local-testing-only}@db:5432/chatbot
      DEPLOYMENT_MODE: development
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/srv/uploads
volumes:
  pgdata:
  uploads:
