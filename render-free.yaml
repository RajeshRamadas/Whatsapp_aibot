# Temporary, disposable testing only. Free resources have limitations and may expire.
services:
  - type: web
    name: whatsapp-aibot-free-test
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-aibot-free-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
      - key: ADMIN_DASHBOARD_USER
        value: admin
      - key: ADMIN_DASHBOARD_PASSWORD
        generateValue: true
      - key: DEPLOYMENT_MODE
        value: production
      - key: CHAT_MODEL
        value: gpt-4.1-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MAX_UPLOAD_MB
        value: "3"
      - key: DELETE_UPLOAD_AFTER_INGEST
        value: "true"
databases:
  - name: whatsapp-aibot-free-db
    databaseName: chatbot
    user: chatbot
    plan: free
