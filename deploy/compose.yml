x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE to the API release image}
  env_file:
    - ${APP_ENV_FILE:-app.env}
  environment:
    ENVIRONMENT: production
    AUTH_COOKIE_SECURE: 'true'
  init: true

x-worker: &worker
  <<: *app
  restart: unless-stopped
  stop_grace_period: 90s
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
  api:
    <<: *app
    build:
      context: ..
    ports:
      - "127.0.0.1:${API_PORT:-8088}:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    <<: *worker
    command: [arq, app.jobs.worker.QueueWorkerSettings]
    healthcheck:
      test: [CMD, arq, --check, app.jobs.worker.QueueWorkerSettings]
      interval: 15s
      timeout: 5s
      retries: 5
  scheduler:
    <<: *worker
    command: [arq, app.jobs.worker.SchedulerSettings]
    healthcheck:
      test: [CMD, arq, --check, app.jobs.worker.SchedulerSettings]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the web release image}
    build:
      context: ../web
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      API_INTERNAL_URL: http://api:8000
      SENTRY_DSN: ${SENTRY_DSN:-}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
