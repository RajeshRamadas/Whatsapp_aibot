name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5433/chatbot_test
      ADMIN_BOOTSTRAP_TOKEN: test-bootstrap
      EMBEDDING_DIMENSIONS: '3'
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: chatbot_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authenticated inbox browser test
        env:
          AUTH_COOKIE_SECURE: 'false'
          WHATSAPP_VERIFY_TOKEN: fixture
          WHATSAPP_APP_SECRET: fixture
          WHATSAPP_ACCESS_TOKEN: fixture
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: |
          python -m scripts.generate_vapid --subject mailto:ci@example.com --output /tmp/inbox-push.env
          set -a
          source /tmp/inbox-push.env
          set +a
          python -m scripts.seed_inbox_e2e
          uvicorn app.main:app --port 8000 &
          cd web
          npm install
          npx playwright install --with-deps chromium
          npm run build
          npm run start &
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/login >/dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
