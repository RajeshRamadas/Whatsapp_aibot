name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5433/chatbot_test
      ADMIN_BOOTSTRAP_TOKEN: test-bootstrap
      EMBEDDING_DIMENSIONS: '3'
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: chatbot_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ensure media and OCR tools are available
        run: |
          if command -v ffmpeg && command -v pdftoppm && command -v prlimit && command -v tesseract && tesseract --list-langs | grep -qx hin; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils util-linux tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
      - run: ruff check app tests
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - name: Validate monitoring configuration
        run: |
          mkdir -p /tmp/chatbot-prometheus
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.16.0/prometheus-3.16.0.linux-amd64.tar.gz | tar -xz -C /tmp/chatbot-prometheus --strip-components=1 prometheus-3.16.0.linux-amd64/promtool
          /tmp/chatbot-prometheus/promtool check rules deploy/alerts.yml
          /tmp/chatbot-prometheus/promtool check config --syntax-only deploy/prometheus.yml
          cp .env.example .env
          docker compose --env-file .env.example config --no-env-resolution --quiet
          rm .env
          cd deploy && /tmp/chatbot-prometheus/promtool test rules alerts.test.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser tests with fake billing
        env:
          AUTH_COOKIE_SECURE: 'false'
          WHATSAPP_VERIFY_TOKEN: fixture
          WHATSAPP_APP_SECRET: fixture
          WHATSAPP_ACCESS_TOKEN: fixture
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: |
          python -m scripts.generate_vapid --subject mailto:ci@example.com --output /tmp/inbox-push.env
          set -a
          source /tmp/inbox-push.env
          set +a
          python -m scripts.seed_inbox_e2e
          python -m scripts.seed_platform_e2e
          python -m scripts.seed_analytics_e2e
          python -m scripts.seed_campaigns_e2e
          python -m scripts.seed_media_e2e
          python -m scripts.seed_ocr_e2e
          python -m scripts.seed_websites_e2e
          python -m scripts.seed_improvements_e2e
          python -m scripts.seed_appointments_e2e
          python -m scripts.seed_locales_e2e
          uvicorn tests.browser_app:app --port 8000 &
          cd web
          npm install
          npx playwright install --with-deps chromium
          npm run build
          npm run start &
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/login >/dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node ../widget/build.mjs --check
      - run: npx tsc --noEmit --strict --target ES2022 --lib ES2022,DOM --skipLibCheck ../widget/widget.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
